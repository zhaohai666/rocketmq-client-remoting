name: client-cpp

on:
  push:
    paths:
      - 'cpp/**'
      - 'scripts/check_cpp_portable_includes.py'
      - '.github/workflows/client-cpp.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'scripts/check_cpp_portable_includes.py'
      - '.github/workflows/client-cpp.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          # lz4 / zstd / openssl match the compile-time backends used by the green local runs:
          # dropping one from CI silently switches to a different runtime branch to test.
          sudo apt-get install -y cmake ninja-build zlib1g-dev g++ gdb \
            liblz4-dev libzstd-dev libssl-dev

      # Run before compiling: CI's trimmed standard library removes transitive includes between
      # headers, so a missing direct include surfaces as "fails at the Nth target, one at a time".
      # This static scan lists them all in one pass.
      - name: Check direct standard-library includes
        run: python3 scripts/check_cpp_portable_includes.py cpp

      - name: Configure
        # -g is only for readable runtime stacks: CI is the only place this class of hang is
        # visible (the local box is macOS, where POSIX-divergence hangs do not reproduce).
        # Optimized line numbers pinpoint exactly which function and which byte it parked on.
        # The optimization level is still decided by CMAKE_BUILD_TYPE=Release; this only adds
        # debug info.
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-g

      # Compiler diagnostics go through ::error:: annotations for the same reason the ctest
      # failures below do: ninja stops with a bare "subcommand failed" in a log that anonymous
      # readers cannot open, and the offending file/line is what makes the difference.
      - name: Build
        run: |
          set +e
          cmake --build cpp/build -j > /tmp/build.log 2>&1
          rc=$?
          cat /tmp/build.log
          grep -E 'FAILED:|error:|Error [0-9]+' /tmp/build.log \
            | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $rc

      # client_id / send_retry / producer_async / namespace_hook were once excluded via -E for
      # sporadic hangs (2026-10-12 record: dead-address fake NS + process exit path). On
      # 2026-10-14 the same root chain was identified: closing an fd does not wake a reader
      # thread sleeping in recv, so the exit-path join waits forever — fixed by adding
      # shutdown(SHUT_RDWR) in closeSocket, and all four tests were restored to the suite.
      # If any of them hangs again, the watchdog below leaves a full thread stack; act on the
      # stack instead of re-excluding.
      # Failing test names go through ::error:: annotations, readable at the top of the Actions
      # page (anonymous API access cannot fetch logs).
      - name: Run ctest
        working-directory: cpp/build
        run: |
          set +e
          # ctest only kills a stuck test after 120s and leaves a bare `***Timeout` in the public
          # log — no stack, no segment info. This watchdog kicks in: for a test process alive
          # past 60s it grabs one full thread stack, then a second one at 105s (same frames in
          # both = truly parked; different frames = still making progress).
          (
            dumped60=""
            dumped105=""
            while :; do
              for pid in $(pgrep -f 'rmq_test_' 2>/dev/null); do
                case "$(cat /proc/${pid}/comm 2>/dev/null)" in
                  rmq_test_*) ;;
                  *) continue ;;
                esac
                age=$(ps -o etimes= -p "${pid}" 2>/dev/null | tr -d ' ')
                [ -n "${age}" ] || continue
                name=$(tr '\0' ' ' < /proc/${pid}/cmdline | cut -c1-100)
                case " ${dumped60} " in *" ${pid} "*) ;; *)
                  if [ "${age}" -ge 60 ]; then
                    dumped60="${dumped60} ${pid}"
                    echo "=== ${pid} @${age}s (1) ${name}"
                    sudo gdb -p "${pid}" -batch -ex 'thread apply all bt' 2>/dev/null
                  fi ;;
                esac
                case " ${dumped105} " in *" ${pid} "*) ;; *)
                  if [ "${age}" -ge 105 ]; then
                    dumped105="${dumped105} ${pid}"
                    echo "=== ${pid} @${age}s (2) ${name}"
                    sudo gdb -p "${pid}" -batch -ex 'thread apply all bt' 2>/dev/null
                  fi ;;
                esac
              done
              sleep 5
            done
          ) > /tmp/bt.log 2>&1 &
          watcher=$!
          ctest --output-on-failure --timeout 120 > /tmp/ctest.log 2>&1
          rc=$?
          kill "${watcher}" 2>/dev/null
          cat /tmp/ctest.log
          {
            grep -E '\*\*\*(Failed|Timeout|Not Run|Missing Command)' /tmp/ctest.log
            sed -n '/The following tests FAILED:/,$p' /tmp/ctest.log
          } | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          if grep -q '\*\*\*Timeout' /tmp/ctest.log; then
            # The test's own segment progress lines (leading `[`) show which segment it stopped
            # at, and the stack shows which frame; both are published only on a real Timeout,
            # keeping green runs noise-free.
            grep -E '^\[' /tmp/ctest.log | tail -20 \
              | while IFS= read -r line; do echo "::error::[segment progress] ${line}"; done
            if [ -s /tmp/bt.log ]; then
              head -120 /tmp/bt.log | while IFS= read -r line; do echo "::error::${line}"; done
            else
              echo "::error::watchdog captured no stack: gdb unavailable or no test process alive past 60s"
            fi
          fi
          exit $rc

      # transport once hung wholesale only on ubuntu runners (run 13/15 stopped at
      # `***Timeout 120 sec`, run 12/16/17 all green) and never reproduced on the local macOS
      # box: on Linux, closing an fd does not wake a thread sleeping in recv. A single run is a
      # coin flip; 3 concurrent x 8 rounds saturating a 2-core runner reproduces it reliably,
      # so this stress step stays permanently as a regression gate — if it ever recurs, segment
      # progress + wchan + full thread stacks point straight at the parked frame.
      - name: Stress transport for the Linux-only reader park
        if: always()
        working-directory: cpp/build
        run: |
          set +e
          failed=0
          rounds=0
          for round in $(seq 1 8); do
            rounds=$((rounds + 1))
            pids=""
            for j in 1 2 3; do
              log=/tmp/tr_${round}_${j}.log
              ./tests/rmq_test_transport > "${log}" 2>&1 &
              pids="${pids} ${!}|${log}"
            done
            deadline=$((SECONDS + 45))
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              alive=0
              for entry in ${pids}; do
                kill -0 "${entry%%|*}" 2>/dev/null && alive=$((alive + 1))
              done
              [ "${alive}" -eq 0 ] && break
              sleep 2
            done
            for entry in ${pids}; do
              pid=${entry%%|*}
              log=${entry#*|}
              if kill -0 "${pid}" 2>/dev/null; then
                echo "::error::transport hung in round ${round}: ${log} (pid ${pid})"
                grep -E '^\[' "${log}" | tail -8 | while IFS= read -r l; do echo "::error::[segment progress] ${l}"; done
                echo "=== kernel side: which threads are parked where (fallback when gdb is unavailable)"
                for t in /proc/${pid}/task/*; do
                  echo "$(basename "${t}") $(cat "${t}/comm" 2>/dev/null) wchan=$(cat "${t}/wchan" 2>/dev/null) state=$(awk '{print $3}' "${t}/stat" 2>/dev/null)"
                done
                sudo gdb -p "${pid}" -batch -ex 'thread apply all bt' 2>/dev/null | head -100
                kill -9 "${pid}" 2>/dev/null
                failed=1
              else
                wait "${pid}"
                rc=$?
                if [ "${rc}" -ne 0 ]; then
                  echo "::error::transport exited non-zero rc=${rc} (${log})"
                  tail -15 "${log}"
                  failed=1
                fi
              fi
            done
            [ "${failed}" -eq 1 ] && break
          done
          echo "transport stress: ${rounds} rounds x 3 workers, $([ "${failed}" -eq 0 ] && echo all green || echo anomalies found)"
          exit "${failed}"
