name: client-cpp

on:
  push:
    paths:
      - 'cpp/**'
      - 'scripts/check_cpp_portable_includes.py'
      - '.github/workflows/client-cpp.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'scripts/check_cpp_portable_includes.py'
      - '.github/workflows/client-cpp.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          # lz4 / zstd / openssl 与本机绿跑时的编译期后端保持一致：CI 少装一个，
          # 就是换一条运行分支来测。
          sudo apt-get install -y cmake ninja-build zlib1g-dev g++ gdb \
            liblz4-dev libzstd-dev libssl-dev

      # 放在编译之前：CI 的标准库裁剪了头文件间的传递包含，缺直接包含的文件会
      # 「编到第 N 个目标才报错、一次只暴露一个」。这里静态扫一遍全部一次列出来。
      - name: Check direct standard-library includes
        run: python3 scripts/check_cpp_portable_includes.py cpp

      - name: Configure
        # -g 只为运行时的可读栈：CI 是唯一能看见这类挂起的地方（本机是 macOS，
        # POSIX 差异类挂起不复现），Optimized 行号能把停在哪个函数哪个字节说清楚。
        # 优化级别仍由 CMAKE_BUILD_TYPE=Release 决定，这里只是追加调试信息。
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-g

      - name: Build
        run: cmake --build cpp/build -j

      # client_id / send_retry / producer_async / namespace_hook 曾经因偶发挂起被 -E 排除
      # （2026-10-12 记录：死地址假 NS + 进程退出路径）。2026-10-14 定位到同一条链：
      # 关 fd 唤不醒睡在 recv 里的读线程，退出路径的 join 于是无限等 —— 已在 closeSocket
      # 里补 shutdown(SHUT_RDWR) 修掉，四条全部放回套件。若某条再挂，下面的看门狗会留下
      # 全线程栈，按栈处理而不是重新排除。
      # 失败用例名走 ::error:: 打印，在 Actions 页面顶部直接可读（匿名 API 拿不到日志）。
      - name: Run ctest
        working-directory: cpp/build
        run: |
          set +e
          # ctest 只会把卡住的用例在 120s 后杀掉，公开日志里剩一句 `***Timeout`，
          # 既不知道停在哪个栈上，也不知道跑到第几段。这里配一个看门狗：活过 60s
          # 的测试进程抓一份全线程栈，105s 再抓第二份（两份同帧=真 parked，不同帧=在磨）。
          (
            dumped60=""
            dumped105=""
            while :; do
              for pid in $(pgrep -f 'rmq_test_' 2>/dev/null); do
                case "$(cat /proc/${pid}/comm 2>/dev/null)" in
                  rmq_test_*) ;;
                  *) continue ;;
                esac
                age=$(ps -o etimes= -p "${pid}" 2>/dev/null | tr -d ' ')
                [ -n "${age}" ] || continue
                name=$(tr '\0' ' ' < /proc/${pid}/cmdline | cut -c1-100)
                case " ${dumped60} " in *" ${pid} "*) ;; *)
                  if [ "${age}" -ge 60 ]; then
                    dumped60="${dumped60} ${pid}"
                    echo "=== ${pid} @${age}s (1) ${name}"
                    sudo gdb -p "${pid}" -batch -ex 'thread apply all bt' 2>/dev/null
                  fi ;;
                esac
                case " ${dumped105} " in *" ${pid} "*) ;; *)
                  if [ "${age}" -ge 105 ]; then
                    dumped105="${dumped105} ${pid}"
                    echo "=== ${pid} @${age}s (2) ${name}"
                    sudo gdb -p "${pid}" -batch -ex 'thread apply all bt' 2>/dev/null
                  fi ;;
                esac
              done
              sleep 5
            done
          ) > /tmp/bt.log 2>&1 &
          watcher=$!
          ctest --output-on-failure --timeout 120 > /tmp/ctest.log 2>&1
          rc=$?
          kill "${watcher}" 2>/dev/null
          cat /tmp/ctest.log
          {
            grep -E '\*\*\*(Failed|Timeout|Not Run|Missing Command)' /tmp/ctest.log
            sed -n '/The following tests FAILED:/,$p' /tmp/ctest.log
          } | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          if grep -q '\*\*\*Timeout' /tmp/ctest.log; then
            # 用例自己打的段进度（行首 `[`）指明停在第几段，栈指明哪一帧；两段都只在真
            # 出现 Timeout 时才公开，绿跑不留噪声。
            grep -E '^\[' /tmp/ctest.log | tail -20 \
              | while IFS= read -r line; do echo "::error::[段进度] ${line}"; done
            if [ -s /tmp/bt.log ]; then
              head -120 /tmp/bt.log | while IFS= read -r line; do echo "::error::${line}"; done
            else
              echo "::error::看门狗没抓到栈：gdb 不可用或没有活过 60s 的测试进程"
            fi
          fi
          exit $rc

      # transport 曾经只在 ubuntu runner 上偶发整条挂死（run 13/15 停在 `***Timeout 120 sec`，
      # run 12/16/17 全绿），本机 macOS 一次都不复现：Linux 关 fd 不会唤醒睡在 recv 里的线程。
      # 单次跑是掷硬币，把 3 份并发 × 8 轮塞满 2 核 runner 才是可靠的复现，因此这里长期留着
      # 当回归闸 —— 一旦复发，段进度 + wchan + 全线程栈会直接指出停在哪一帧。
      - name: Stress transport for the Linux-only reader park
        if: always()
        working-directory: cpp/build
        run: |
          set +e
          failed=0
          rounds=0
          for round in $(seq 1 8); do
            rounds=$((rounds + 1))
            pids=""
            for j in 1 2 3; do
              log=/tmp/tr_${round}_${j}.log
              ./tests/rmq_test_transport > "${log}" 2>&1 &
              pids="${pids} ${!}|${log}"
            done
            deadline=$((SECONDS + 45))
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              alive=0
              for entry in ${pids}; do
                kill -0 "${entry%%|*}" 2>/dev/null && alive=$((alive + 1))
              done
              [ "${alive}" -eq 0 ] && break
              sleep 2
            done
            for entry in ${pids}; do
              pid=${entry%%|*}
              log=${entry#*|}
              if kill -0 "${pid}" 2>/dev/null; then
                echo "::error::transport 在第 ${round} 轮挂住：${log} (pid ${pid})"
                grep -E '^\[' "${log}" | tail -8 | while IFS= read -r l; do echo "::error::[段进度] ${l}"; done
                echo "=== 内核侧：哪些线程停在哪（无 gdb 时的兜底）"
                for t in /proc/${pid}/task/*; do
                  echo "$(basename "${t}") $(cat "${t}/comm" 2>/dev/null) wchan=$(cat "${t}/wchan" 2>/dev/null) state=$(awk '{print $3}' "${t}/stat" 2>/dev/null)"
                done
                sudo gdb -p "${pid}" -batch -ex 'thread apply all bt' 2>/dev/null | head -100
                kill -9 "${pid}" 2>/dev/null
                failed=1
              else
                wait "${pid}"
                rc=$?
                if [ "${rc}" -ne 0 ]; then
                  echo "::error::transport 非零退出 rc=${rc}（${log}）"
                  tail -15 "${log}"
                  failed=1
                fi
              fi
            done
            [ "${failed}" -eq 1 ] && break
          done
          echo "transport 压测：${rounds} 轮 × 3 并发，$([ "${failed}" -eq 0 ] && echo 全绿 || echo 有异常)"
          exit "${failed}"
