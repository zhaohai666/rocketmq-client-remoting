name: client-php

on:
  push:
    paths:
      - 'php/**'
      - '.github/workflows/client-php.yml'
  pull_request:
    paths:
      - 'php/**'
      - '.github/workflows/client-php.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zstd, lz4
        # The compression matrix's CLI-first path falls back to the pure implementation when extensions are missing; a missing extension is not fatal.

      - name: Run offline test suite
        working-directory: php
        run: php tests/run_all.php
