name: client-rust

on:
  push:
    paths:
      - 'rust/**'
      - '.github/workflows/client-rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/client-rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The failure list goes through ::error:: annotations: Actions raw logs are only visible
      # when signed in, while annotations are publicly readable.
      - name: Run offline test suite
        working-directory: rust
        env:
          RUST_BACKTRACE: 1
        run: |
          set +e
          # cargo test has no per-test timeout: one stuck test runs all the way to GitHub's
          # 6-hour ceiling, with no verdict and no annotation (run logs require sign-in). Give
          # the whole round a 20-minute wall clock — the full local suite takes about 10
          # seconds, and a cold-cache CI build stays in that bracket. On expiry, grab the stuck
          # process's thread stacks plus the log tail and emit them as ::error::, so "which test
          # is stuck" is visible in the public annotations.
          timeout -k 60 1200 cargo test > /tmp/cargo.log 2>&1
          rc=$?
          if [ "$rc" = "124" ] || [ "$rc" = "137" ]; then
            echo "::error::cargo test exceeded the 20-minute wall clock (full local run is about 10 seconds) — thread stacks at the moment of the hang below"
            command -v gdb > /dev/null || sudo apt-get install -y gdb > /dev/null 2>&1
            for pid in $(pgrep -f 'target/debug/deps/'); do
              echo "--- pid ${pid}: $(tr '\0' ' ' < /proc/${pid}/cmdline | cut -c1-120)"
              sudo gdb -p "${pid}" -batch -ex 'thread apply all bt' 2>/dev/null | head -80
            done > /tmp/bt.log 2>&1
            # An empty stack capture means no test process was grabbable (stuck in
            # compile/link); the log tail distinguishes the two cases
            [ -s /tmp/bt.log ] || echo "::error::no test-process stack captured; the hang is likely in compile/link rather than a test"
            head -60 /tmp/bt.log | while IFS= read -r line; do echo "::error::${line}"; done
            tail -8 /tmp/cargo.log | while IFS= read -r line; do echo "::error::[cargo.log tail] ${line}"; done
            pkill -9 -f 'target/debug/deps/' > /dev/null 2>&1
          fi
          grep -E '^(test .* FAILED|error(\[E[0-9]+\])?:|failures:$)' /tmp/cargo.log \
            | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          sed -n '/^failures:$/,/^test result/p' /tmp/cargo.log | head -40 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          # This used to be cargo's direct output; now it goes to a file and the result section
          # is pasted back into the step log at the end
          tail -40 /tmp/cargo.log
          exit $rc
