name: client-nodejs

on:
  push:
    paths:
      - 'nodeJs/**'
      - '.github/workflows/client-nodejs.yml'
  pull_request:
    paths:
      - 'nodeJs/**'
      - '.github/workflows/client-nodejs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Zero third-party dependencies: node --experimental-strip-types runs the TS directly;
      # selfcheck covers all 53 modules plus smoke cases.
      - name: Run selfcheck (all modules + smoke tests)
        working-directory: nodeJs
        run: node --experimental-strip-types selfcheck.ts

      # The package ships dist/ only, and the build type-checks nothing: a module
      # that imports cleanly from src can still be emitted broken.
      - name: Install dev dependencies
        working-directory: nodeJs
        run: npm ci --no-audit --no-fund

      - name: Build and smoke the packaged dist
        working-directory: nodeJs
        run: |
          npm run build
          npm run smoke:dist
