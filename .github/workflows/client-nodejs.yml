name: client-nodejs

on:
  push:
    paths:
      - 'nodeJs/**'
      - '.github/workflows/client-nodejs.yml'
  pull_request:
    paths:
      - 'nodeJs/**'
      - '.github/workflows/client-nodejs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Zero third-party dependencies: node --experimental-strip-types runs the TS directly;
      # selfcheck covers all 53 modules plus smoke cases.
      - name: Run selfcheck (all modules + smoke tests)
        working-directory: nodeJs
        run: node --experimental-strip-types selfcheck.ts
