[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketmq-client-remoting"
version = "4.9.4"
description = "Python implementation of Apache RocketMQ 4.x remoting client (client + remoting protocol)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["rocketmq", "mq", "messaging", "remoting", "client"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.setuptools]
# rocketmq_logging.py is a root-level module, not inside any package: 15 library modules
# (client/*.py, remoting/client.py) do `from rocketmq_logging import get_logger`. Without
# py-modules the wheel installs fine but every import of client/remoting dies with
# ModuleNotFoundError on the first get_logger line.
py-modules = ["rocketmq_logging"]

[tool.setuptools.packages.find]
# The python/ directory is itself the source root: client / common / remoting are three
# flat top-level packages (the legacy nested rocketmq.* package was retired with the
# directory restructuring).
include = ["client*", "common*", "remoting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]