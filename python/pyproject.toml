[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketmq-client-remoting"
version = "0.0.2"
description = "Python implementation of Apache RocketMQ 4.x remoting client (client + remoting protocol)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["rocketmq", "mq", "messaging", "remoting", "client"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Optional compression codecs. ZLIB needs nothing (stdlib); LZ4 / ZSTD bodies
# only arise when a broker (or a producer configured with the matching
# compress_type) delivers them, and the codecs raise a clear "pip install ..."
# error when the package is missing (see rocketmq_client_remoting/common/message_decoder.py).
[project.optional-dependencies]
lz4 = ["lz4"]
zstd = ["zstandard"]
full = ["lz4", "zstandard"]

[tool.setuptools]
# Everything lives inside the single namespace package rocketmq_client_remoting
# (client / common / remoting are its subpackages, logging is a module). The
# 0.0.1 layout shipped three flat top-level packages (client / common / remoting)
# plus a root rocketmq_logging module, which polluted site-packages with generic
# names — restructured into one package in 0.0.2.

[tool.setuptools.packages.find]
include = ["rocketmq_client_remoting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
